name: Tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  test:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    defaults:
      run:
        working-directory: HuntListaBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: HuntListaBot/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
